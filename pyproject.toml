[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanarb"
version = "0.1.0"
description = "San Arb - a minimum-capital arbitrage scanner and auto-trade engine for FYERS."
requires-python = ">=3.10"
# Core runs on the standard library only, so it installs and tests anywhere.
dependencies = []

[project.optional-dependencies]
# Live trading / data via FYERS. Not needed for paper mode or tests.
live = ["fyers-apiv3>=3.0.0"]
dev = ["pytest>=8.0"]

[project.scripts]
sanarb = "sanarb.cli:main"

[tool.setuptools.packages.find]
include = ["sanarb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
